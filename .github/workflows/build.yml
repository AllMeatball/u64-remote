name: Build

on:
  push:
    branches: [ "master", "workflows" ]
  pull_request:
    branches: [ "master", "workflows" ]

permissions:
  contents: write
  pull-requests: none 
  issues: none
  packages: none

jobs:
  build:
    name: Generate artifacts
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [windows, linux, darwin]
        arch: [amd64, arm64]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version tag
        id: get-tag
        run: |
          # Fetch tags
          git fetch --tags
          
          GIT_TAG=$(git describe --tags --always)
          RESULT=$?

          if [ $RESULT -eq 0 ]; then
            echo "tag=$GIT_TAG" >> $GITHUB_OUTPUT
            echo "Got version tag: $GIT_TAG"
          else
            exit 1
          fi
  
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'
  
      - name: Build
        run: |
          mkdir -p ci-build
          GOOS=${{ matrix.target }} GOARCH=${{ matrix.arch }} go build \
            -v \
            -o ci-build \
            ./...
            
          cd ci-build
          zip -r \
            "../u64-remote-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.get-tag.outputs.tag }}.zip" \
            .
  
          # TODO (Linux): use static musl for better compat on portablity
          # TODO (macOS): use signing key (using secrets API) and universal binary support
  

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: u64-remote-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.get-tag.outputs.tag }}
          path: u64-remote-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.get-tag.outputs.tag }}.zip
  release:
    name: 'Release'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ci-build
          merge-multiple: true

      - name: Get uploadtool
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          repository: 'probonopd/uploadtool'
          path: 'uploadtool'

      - name: Upload continuous build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # export UPLOADTOOL_ISPRERELEASE=true
          ./uploadtool/upload.sh ci-build/*
