name: Build

on:
  push:
    branches: [ "master", "workflows" ]
  pull_request:
    branches: [ "master", "workflows" ]

jobs:
  upload:
    name: Generate Artifacts
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [windows, linux, darwin]
        arch: [amd64, amd64, arm64]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25x'

    - name: Build
      run: |
        # Windows
        GOOS=${{ matrix.target }} GOARCH=${{ matrix.arch }} go build \
          -v \
          -o ci-build \
          ./...

        # TODO (Linux): use static musl for better compat on portablity
        # TODO (macOS): use signing key (using secrets API) and universal binary support

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}-${{ matrix.arch }}
        path: ci-build
      
